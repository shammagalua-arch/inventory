<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Google Sheets Connected</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        body {background:#f0f4f8;padding:20px;max-width:1200px;margin:0 auto;}
        h1 {color:#2d3748;text-align:center;margin-bottom:25px;}
        .form-container{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 10px #0000001a;margin-bottom:20px;}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:15px;}
        input{padding:10px;border:1px solid #cbd5e0;border-radius:6px;font-size:15px;}
        button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:500;transition:.2s;}
        .btn-add{background:#3182ce;color:white;}
        .btn-add:hover{background:#2b6cb0;}
        .btn-update{background:#38a169;color:white;}
        .btn-update:hover{background:#2f855a;}
        .btn-delete{background:#e53e3e;color:white;}
        .btn-delete:hover{background:#c53030;}
        .btn-cancel{background:#718096;color:white;margin-left:8px;}
        .hidden{display:none;}
        table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #0000001a;}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #e2e8f0;}
        th{background:#2d3748;color:white;}
        tr:hover{background:#f7fafc;}
        .empty-msg{text-align:center;padding:20px;color:#718096;}
        .status{padding:8px;margin:10px 0;border-radius:5px;}
        .success{background:#f0fff4;color:#22543d;}
        .error{background:#fef2f2;color:#742a2a;}
    </style>
</head>
<body>

    <h1>📦 lina-and-shammi inventory system /h1>
    <div id="statusMsg" class="status hidden"></div>

    <!-- ADD / EDIT FORM -->
    <div class="form-container">
        <div class="form-grid">
            <input type="text" id="item-id" class="hidden">
            <input type="text" id="item-name" placeholder="Item Name" required>
            <input type="number" id="item-qty" placeholder="Quantity" min="0" required>
            <input type="number" id="item-price" placeholder="Unit Price ₱" min="0" step="0.01" required>
        </div>
        <button id="btn-save" class="btn-add">Add Item</button>
        <button id="btn-cancel" class="btn-cancel hidden">Cancel</button>
    </div>

    <!-- INVENTORY TABLE -->
    <table>
        <thead><tr><th>Item Name</th><th>Quantity</th><th>Unit Price</th><th>Total Value</th><th>Actions</th></tr></thead>
        <tbody id="inventory-body"><tr><td colspan="5" class="empty-msg">Loading...</td></tr></tbody>
    </table>

    <script>
        // ========== PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE ==========
        const GS_URL = "https://script.google.com/macros/s/AKfycbwkb9U8uFAyfONwtXzFIoMlZTErvsCMwA9QPkulkwE8peYODYLcYA6ijiRc3CP95jZ_tw/exec"
        const formSaveBtn = document.getElementById("btn-save");
        const cancelBtn = document.getElementById("btn-cancel");
        const itemIdInput = document.getElementById("item-id");
        const itemNameInput = document.getElementById("item-name");
        const itemQtyInput = document.getElementById("item-qty");
        const itemPriceInput = document.getElementById("item-price");
        const tableBody = document.getElementById("inventory-body");
        const statusBox = document.getElementById("statusMsg");

        window.onload = loadInventory;
        formSaveBtn.addEventListener("click", saveItem);
        cancelBtn.addEventListener("click", resetForm);

        // --- Show Status ---
        function showStatus(text,isSuccess){
            statusBox.textContent=text;statusBox.classList.remove("hidden","success","error");
            statusBox.classList.add(isSuccess?"success":"error");
            setTimeout(()=>statusBox.classList.add("hidden"),2500);
        }

        // --- READ: Get Data from Sheet ---
        async function loadInventory(){
            try{
                const res = await fetch(GS_URL);
                const items = await res.json();
                renderInventory(items);
            }catch(e){
                tableBody.innerHTML=`<tr><td colspan="5" class="empty-msg">❌ Failed load data — check URL/permissions</td></tr>`;
                showStatus("Error loading data!",false);
            }
        }

        function renderInventory(items){
            tableBody.innerHTML="";
            if(!items.length){tableBody.innerHTML=`<tr><td colspan="5" class="empty-msg">No inventory items yet.</td></tr>`;return;}
            items.forEach(i=>{
                const row = document.createElement("tr");
                row.innerHTML=`
                    <td>${i.name}</td><td>${i.qty}</td><td>${parseFloat(i.price).toFixed(2)}</td><td>${parseFloat(i.total).toFixed(2)}</td>
                    <td><button class="btn-update" onclick="editItem('${i.id}','${i.name}',${i.qty},${i.price})">Edit</button>
                    <button class="btn-delete" onclick="deleteItem('${i.id}')">Delete</button></td>
                `;tableBody.appendChild(row);
            })
        }

        // --- CREATE / UPDATE ---
        async function saveItem(){
            const name=itemNameInput.value.trim();const qty=+itemQtyInput.value;const price=+itemPriceInput.value;const editId=itemIdInput.value;
            if(!name||isNaN(qty)||isNaN(price)||qty<0||price<0)return alert("Fill valid values!");
            const payload = editId?{action:"update",id:editId,name,qty,price}:{action:"add",id:Date.now()+"",name,qty,price};
            try{
                await fetch(GS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
                showStatus(editId?"✅ Updated!":"✅ Added!",true);
                resetForm();loadInventory();
            }catch(e){showStatus("❌ Error saving!",false);}
        }

        // --- Load to Edit ---
        function editItem(id,name,qty,price){
            itemIdInput.value=id;itemNameInput.value=name;itemQtyInput.value=qty;itemPriceInput.value=price;
            formSaveBtn.textContent="Update Item";formSaveBtn.className="btn-update";cancelBtn.classList.remove("hidden");
        }

        // --- DELETE ---
        async function deleteItem(id){
            if(!confirm("Delete this item?"))return;
            try{
                await fetch(GS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"delete",id:id})});
                showStatus("🗑️ Deleted!",true);loadInventory();
            }catch(e){showStatus("❌ Delete failed!",false);}
        }

        function resetForm(){
            itemIdInput.value="";itemNameInput.value="";itemQtyInput.value="";itemPriceInput.value="";
            formSaveBtn.textContent="Add Item";formSaveBtn.className="btn-add";cancelBtn.classList.add("hidden");
        }
    </script>
</body>
</html>
